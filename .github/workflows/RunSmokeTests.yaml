name: Run Java Smoke Tests for PhotoPrism

on:
  push:
    branches:
      - feature/my_feature

jobs:
  # 🟢 Job 1: Run UI Tests in Chrome
  TestChrome_131_0:
    name: UI Tests - Chrome 131.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Chrome UI Tests
        run: |
          cd photoprism-tests
          export BROWSER=chrome
          export GRID_URL=http://localhost:4444
          mvn clean test -Dtest=TestAutomationProjectTesting.SmokeTests

  # 🟠 Job 2: Run UI Tests in Firefox
  TestFirefox_133_0:
    name: UI Tests - Firefox 133.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Firefox UI Tests
        run: |
          cd photoprism-tests
          export BROWSER=firefox
          export GRID_URL=http://localhost:4444
          mvn clean test -Dtest=TestAutomationProjectTesting.SmokeTests

  # 🔵 Job 3: Run API Tests
  TestAPI:
    name: API Tests - Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run API Tests
        run: |
          cd photoprism-tests
          export BROWSER=chrome
          export GRID_URL=http://localhost:4444
          mvn clean test -Dtest=TestAutomationProjectTesting.ApiTest

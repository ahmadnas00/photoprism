name: Run Java Smoke Tests for PhotoPrism

on:
  push:
    branches:
      - feature/my_feature
  workflow_dispatch:
    inputs:
      chrome_131_0:
        description: 'Run tests on Chrome (131.0)'
        required: false
        type: boolean
      firefox_133_0:
        description: 'Run tests on Firefox (133.0)'
        required: false
        type: boolean
      grid_url:
        description: 'Selenium Grid URL (default: localhost)'
        required: false
        default: 'http://localhost:4444'

jobs:
  TestChrome_131_0:
    name: Test Chrome 131.0
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.chrome_131_0 == 'true' }}
    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove existing PhotoPrism container if it exists
        run: |
          docker stop ahmad-photoprism || true
          docker rm ahmad-photoprism || true

      - name: Pull and Run PhotoPrism Docker Container
        run: |
          docker pull ahmadnas/photoprism-app
          docker run -d --name ahmad-photoprism \
            -v "$(pwd)/storage/originals:/photoprism/originals" \
            -p 2342:2342 ahmadnas/photoprism-app

      - name: Wait for PhotoPrism to initialize
        run: sleep 30

      - name: Launch Selenium Grid - Chrome
        run: |
          docker run --name grid_container -d -p 4444:4444 --shm-size=2gb selenium/standalone-chrome:131.0-chromedriver-131.0-grid-4.27.0-20250101

      - name: Run Smoke Tests on Chrome
        run: |
          cd photoprism-tests
          export BROWSER=chrome
          export GRID_URL=${{ github.event.inputs.grid_url || 'http://localhost:4444' }}

          mvn test -Dtest=TestAutomationProjectTesting.SmokeTests

      - name: Tear down containers
        if: always()
        run: |
          docker stop grid_container || true
          docker rm grid_container || true
          docker stop ahmad-photoprism || true
          docker rm ahmad-photoprism || true

  TestFirefox_133_0:
    name: Test Firefox 133.0
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.firefox_133_0 == 'true' }}
    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove existing PhotoPrism container if it exists
        run: |
          docker stop ahmad-photoprism || true
          docker rm ahmad-photoprism || true

      - name: Pull and Run PhotoPrism Docker Container
        run: |
          docker pull ahmadnas/photoprism-app
          docker run -d --name ahmad-photoprism \
            -v "$(pwd)/storage/originals:/photoprism/originals" \
            -p 2342:2342 ahmadnas/photoprism-app

      - name: Wait for PhotoPrism to initialize
        run: sleep 30

      - name: Launch Selenium Grid - Firefox
        run: |
          docker run --name grid_container -d -p 4444:4444 --shm-size=2gb selenium/standalone-firefox:133.0-geckodriver-0.35-grid-4.27.0-20250101

      - name: Run Smoke Tests on Firefox
        run: |
          cd photoprism-tests
          export BROWSER=firefox
          export GRID_URL=${{ github.event.inputs.grid_url || 'http://localhost:4444' }}

          mvn test -Dtest=TestAutomationProjectTesting.SmokeTests

      - name: Tear down containers
        if: always()
        run: |
          docker stop grid_container || true
          docker rm grid_container || true
          docker stop ahmad-photoprism || true
          docker rm ahmad-photoprism || true

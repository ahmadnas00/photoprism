name: Build & Test PhotoPrism

on:
  push:
    branches:
      - feature/my_feature
  pull_request:
    branches:
      - feature/my_feature

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js (for running unit tests)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Adjust if needed

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Authenticate with GitHub Package Registry (if needed)
      - name: Authenticate with GitHub Package Registry
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

      # Log in to DockerHub (for publishing images later)
      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Build the Docker image
      - name: Build Docker Image
        run: docker build -t photoprism-app .

      # Run static analysis (example: ESLint for JavaScript)
      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx || true  # Modify based on your project

      # Run security vulnerability scan on Docker image
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'photoprism-app'
          format: 'table'
          exit-code: 1
          ignore-unfixed: true

      # Run Specific Photo Tests (ONLY 3 tests)
      - name: Run Only Specific Photo Tests
        run: npx mocha frontend/tests/unit/model/photo_test.js --grep "should get photo (entity name|uuid|title)"

      # Push Docker Image to DockerHub (ONLY if all tests pass)
      - name: Push Docker Image to DockerHub
        if: success()
        run: |
          docker tag photoprism-app ${{ secrets.DOCKERHUB_USERNAME }}/photoprism-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/photoprism-app:latest

      # Upload test results (optional)
      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/  # Adjust if test reports are saved elsewhere

      # Logout from DockerHub
      - name: Logout from DockerHub
        run: docker logout

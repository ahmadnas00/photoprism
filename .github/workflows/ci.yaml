name: Build Environment For PhotoPrism

on:
  push:
    branches:
      - feature/my_feature
  pull_request:
    branches:
      - feature/my_feature

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Install golangci-lint for Go static analysis
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      # ✅ Run golangci-lint for Go code analysis
      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./... || exit 1  # Fail if linting errors exist

      # ✅ Build the Docker image
      - name: Build Docker Image
        run: docker build -t photoprism-app .

      # ✅ Log in to DockerHub
      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ✅ Start PhotoPrism in Docker
      - name: Start PhotoPrism
        run: |
          docker run -d --name photoprism -p 2342:2342 -e PHOTOPRISM_ADMIN_PASSWORD="photoprism" photoprism/photoprism:latest
          sleep 15  # Wait for it to start

      # ✅ Run Authentication & Sharing Tests
      - name: Run authentication and sharing tests
        run: make acceptance-run-chromium TESTS='--test-meta "testID=authentication-001" --test-meta "testID=sharing-001"' || true

      # ✅ Push Docker Image to DockerHub
      - name: Push Docker Image to DockerHub
        if: always()
        run: |
          docker tag photoprism-app ${{ secrets.DOCKERHUB_USERNAME }}/photoprism-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/photoprism-app:latest

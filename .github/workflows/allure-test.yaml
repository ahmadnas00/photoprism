name: Generate Test Report

on:
  push:
    branches:
      - feature/my_feature

permissions:
  contents: write

jobs:
  api-test:
    name: Run API Tests and Generate Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pull and Run PhotoPrism Docker Container
        run: |
          docker pull ahmadnas/photoprism-app
          docker run -d --name ahmad-photoprism \
            -v "$(pwd)/storage/originals:/photoprism/originals" \
            -p 2342:2342 ahmadnas/photoprism-app

      - name: Wait for PhotoPrism to be accessible
        run: |
          for i in {1..30}; do
            curl --silent --fail http://localhost:2342 && break
            echo "Waiting for PhotoPrism..."
            sleep 2
          done

      - name: Run API Tests
        run: |
          cd photoprism-tests
          export BASE_URL=http://localhost:2342
          mvn clean test -Dtest=TestAutomationProjectTesting.ApiTest

      - name: Load test report history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: photoprism-tests/target/allure-results

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

name: Run Java Smoke Tests for PhotoPrism

on:
  workflow_dispatch:  # Allows manual execution
  push:
    branches:
      - feature/my_feature

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoprism-tests
          path: photoprism-tests.tar.gz

  TestAPI:
    name: API Tests with Jacoco
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      checks: write
      contents: read

    steps:
      - name: Download test repository
        uses: actions/download-artifact@v4
        with:
          name: photoprism-tests
          path: photoprism-tests

      - name: Pull and Run PhotoPrism Docker Container
        run: |
          docker pull ahmadnas/photoprism-app
          docker run -d --name ahmad-photoprism \
            -v "$(pwd)/storage/originals:/photoprism/originals" \
            -p 2342:2342 ahmadnas/photoprism-app

      - name: Wait for PhotoPrism to be accessible
        run: |
          for i in {1..30}; do
            curl --silent --fail http://localhost:2342 && break
            echo "Waiting for PhotoPrism..."
            sleep 2
          done

      - name: Launch standalone grid - Chrome (for API tests)
        run: |
          docker run --name grid_container -d -p 4444:4444 --shm-size=2gb selenium/standalone-chrome:latest

      - name: Run API Tests with Jacoco
        run: |
          cd photoprism-tests
          export BROWSER=chrome
          export GRID_URL=http://localhost:4444
          export BASE_URL=http://localhost:2342
          mvn clean verify -Dtest=TestAutomationProjectTesting.ApiTest -Djacoco.destFile=target/jacoco.exec

      - name: Upload Jacoco exec results
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-jacoco
          path: photoprism-tests/target/jacoco.exec

  GenerateJacocoReport:
    name: Generate Jacoco Test Coverage Report
    needs: TestAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Java test repository
        uses: actions/checkout@v4
        with:
          repository: ahmadnas00/PhotoprismProject
          path: photoprism-tests

      - name: Download Jacoco exec results
        uses: actions/download-artifact@v4
        with:
          name: api-tests-jacoco
          path: photoprism-tests/target/

      - name: Generate Jacoco Report
        run: |
          cd photoprism-tests
          mvn jacoco:report -DskipTests=true

      - name: Upload Jacoco Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-report
          path: photoprism-tests/target/site/jacoco/

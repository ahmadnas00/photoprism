name: SpotifyCatalogAPI tests

on: [push]

permissions:
  contents: write


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download test repository
        uses: actions/download-artifact@v4
        with:
          name: photoprism-tests
          path: photoprism-tests

      - name: Pull and Run PhotoPrism Docker Container
        run: |
          docker pull ahmadnas/photoprism-app
          docker run -d --name ahmad-photoprism \
            -v "$(pwd)/storage/originals:/photoprism/originals" \
            -p 2342:2342 ahmadnas/photoprism-app

      - name: Wait for PhotoPrism to be accessible
        run: |
          for i in {1..30}; do
            curl --silent --fail http://localhost:2342 && break
            echo "Waiting for PhotoPrism..."
            sleep 2
          done

      - name: Launch standalone grid - Chrome
        run: |
          docker run --name grid_container -d -p 4444:4444 --shm-size=2gb selenium/standalone-chrome:latest


      - name: Run Tests
        run: |
          cd photoprism-tests
          export BROWSER=chrome
          export GRID_URL=http://localhost:4444
          export BASE_URL=$BASE_URL
          mvn clean test -Dtest=TestAutomationProjectTesting.SmokeTests

      - name: Load test report history from gh-pages page
        uses: actions/checkout@v3
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages


      - name: Tear down containers
        if: always()
        run: |
          docker stop grid_container || true
          docker rm grid_container || true
          docker stop ahmad-photoprism || true
          docker rm ahmad-photoprism || true
          

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
name: Build and Run Environment Tests

on:
  push:
    branches:
      - feature/my_feature  # Runs only on this branch
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make chromium-browser
          npm install  # Ensure dependencies are installed

      - name: Run only authentication and sharing tests
        run: |
          make acceptance-run-chromium TESTS='--test-meta "testID=authentication-001" --test-meta "testID=sharing-001"'
